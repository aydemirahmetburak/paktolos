# Her PR'da ve main'e her gönderimde tüm testler çalışır.
# Kırmızıysa birleştirme; ayrıntı "Testler" adımının çıktısında.
name: Testler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tarayıcı (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Testler
        run: npm test
